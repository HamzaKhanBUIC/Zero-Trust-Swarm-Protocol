services:
  idp-daemon:
    build: .
    container_name: swarm-idp
    command: ["./idp-daemon", "--listen", "0.0.0.0:23790"]
    environment:
      # Off loopback, every identity needs its own bootstrap token (see .env.example).
      - IDP_ALLOWLIST=swarm-registry=${REGISTRY_IDP_TOKEN:?set in .env},agent-alpha=${ALPHA_IDP_TOKEN:?set in .env},agent-sidecar=${SIDECAR_IDP_TOKEN:?set in .env}
    networks:
      - swarm-net

  registry:
    build: .
    container_name: swarm-registry
    command: ["./registry", "--listen", "0.0.0.0:9000"]
    environment:
      - IDP_HOST=swarm-idp:23790
      - IDP_TOKEN=${REGISTRY_IDP_TOKEN:?set in .env}
    depends_on:
      - idp-daemon
    networks:
      - swarm-net

  agent-alpha:
    build: .
    container_name: swarm-agent-alpha
    command: ["./agent", "--id", "agent-alpha", "--listen", "0.0.0.0:9101", "--caps", "math-solver", "--registry", "swarm-registry:9000"]
    environment:
      - IDP_HOST=swarm-idp:23790
      - IDP_TOKEN=${ALPHA_IDP_TOKEN:?set in .env}
    depends_on:
      - registry
    networks:
      - swarm-net

  sidecar:
    build: .
    container_name: swarm-sidecar
    command: ["./sidecar", "--id", "agent-sidecar", "--listen", "0.0.0.0:8080", "--listen-mtls", "0.0.0.0:9102", "--caps", "data-analyzer", "--upstream", "http://host.docker.internal:5000/", "--registry", "swarm-registry:9000"]
    environment:
      - IDP_HOST=swarm-idp:23790
      - IDP_TOKEN=${SIDECAR_IDP_TOKEN:?set in .env}
    ports:
      - "127.0.0.1:8080:8080" # Host-only: the sidecar API has no auth and signs as agent-sidecar
    depends_on:
      - agent-alpha
    networks:
      - swarm-net

networks:
  swarm-net:
    driver: bridge
